name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle assembleDebug
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false
      - run: gradle --no-daemon assembleDebug
      - name: Publish APK as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create qoder-relay-nightly --title "Qoder Relay nightly" --prerelease 2>/dev/null || true
          gh release upload qoder-relay-nightly app/build/outputs/apk/debug/app-debug.apk --clobber
