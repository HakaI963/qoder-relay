name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle assembleDebug
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false
      - name: Restore or seed stable debug keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download keystore-seed --pattern debug.keystore --dir app --clobber 2>/dev/null; then
            echo "keystore restored"
          else
            keytool -genkeypair -keystore app/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=Android"
            gh release create keystore-seed --title "keystore seed" --prerelease app/debug.keystore \
              || gh release upload keystore-seed app/debug.keystore --clobber
          fi
      - run: gradle --no-daemon assembleDebug
      - name: Publish APK as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create qoder-relay-nightly --title "Qoder Relay nightly" --prerelease 2>/dev/null || true
          gh release upload qoder-relay-nightly app/build/outputs/apk/debug/app-debug.apk --clobber
