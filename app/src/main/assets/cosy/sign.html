<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>cosy</title></head>
<body>
<script src="auth_glue.js"></script>
<script>
(function(){
  var A = window.QoderAuth;
  var ready = false;
  window.__ctx = null;
  window.__machineId = '';
  window.__uid = '';
  window.__enc = '';
  window.__key = '';
  window.__state = 'loading';
  fetch('auth.wasm').then(function(r){ return r.arrayBuffer(); }).then(function(buf){
    return A.default({ module_or_path: new Uint8Array(buf) });
  }).then(function(){
    ready = true;
    window.__state = 'ready';
  }).catch(function(e){
    window.__state = 'error: ' + (e && e.message ? e.message : e);
  });

  window.__genFields = function(jsonStr){
    try { return JSON.stringify({ ok: true, out: A.generate_runtime_auth_fields(jsonStr) }); }
    catch (e) { return JSON.stringify({ ok: false, err: String(e && e.message || e) }); }
  };

  window.__reset = function(machineId, uid, enc, key){
    try { if (window.__ctx) { try { window.__ctx.free(); } catch(e){} window.__ctx = null; } }
    catch(e){}
    window.__machineId = machineId; window.__uid = uid; window.__enc = enc; window.__key = key;
    return 'ok';
  };

  window.__signInfer = function(endpoint, bodyJson, modelKey, modelSource){
    try {
      if (!ready) return JSON.stringify({ ok:false, err: window.__state });
      if (!window.__ctx) {
        window.__ctx = new A.QoderContext(window.__machineId, '1.1.79',
          JSON.stringify({ uid: window.__uid, encrypt_user_info: window.__enc, key: window.__key }));
      }
      var r = window.__ctx.prepareInferRequest(endpoint, bodyJson, modelKey, modelSource);
      var headers = {};
      r.headers.forEach(function(v,k){ headers[k]=v; });
      var out = { ok:true, url:r.url, headers:headers, body:r.body };
      try { r.free(); } catch(e){}
      return JSON.stringify(out);
    } catch (e) { return JSON.stringify({ ok:false, err:String(e && e.message || e) }); }
  };

  window.__signRequest = function(endpoint, path, method){
    try {
      if (!ready) return JSON.stringify({ ok:false, err: window.__state });
      if (!window.__ctx) {
        window.__ctx = new A.QoderContext(window.__machineId, '1.1.79',
          JSON.stringify({ uid: window.__uid, encrypt_user_info: window.__enc, key: window.__key }));
      }
      var r = window.__ctx.prepareRequest(endpoint, path, method, 'auth', undefined, undefined);
      var headers = {};
      r.headers.forEach(function(v,k){ headers[k]=v; });
      var out = { ok:true, url:r.url, headers:headers, body:'' };
      try { r.free(); } catch(e){}
      return JSON.stringify(out);
    } catch (e) { return JSON.stringify({ ok:false, err:String(e && e.message || e) }); }
  };
})();
</script>
</body></html>
